name: Build merchant Android APK

permissions:
  contents: write

on:
  repository_dispatch:
    types: [build-merchant-app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate dispatch payload and create merchant manifest
        env:
          DISPATCH_PAYLOAD: ${{ github.event.client_payload.app_data || toJson(github.event.client_payload) }}
        run: |
          echo "$DISPATCH_PAYLOAD" | jq '.' > dispatch-payload.json

          echo "========== dispatch-payload.json =========="
          cat dispatch-payload.json

          dart run tool/prepare_merchant_manifest_from_dispatch.dart \
            dispatch-payload.json merchant-build.json

      - name: Print merchant manifest
        run: |
          echo "========== merchant-build.json =========="
          cat merchant-build.json

      - name: Apply merchant build
        run: |
          dart run tool/apply_merchant_build.dart merchant-build.json

          TENANT_SLUG=$(jq -r '.tenantSlug // "merchant"' merchant-build.json | tr -d '\n' | tr -d ' ')
          APP_NAME=$(jq -r '.appName // "App"' merchant-build.json | tr -d '\n' | tr -d ' ')
          VERSION=$(jq -r '.version // "1.0.0"' merchant-build.json | tr -d '\n' | tr -d ' ')
          BUILD_NUMBER=$(jq -r '.buildNumber // 1' merchant-build.json | tr -d '\n' | tr -d ' ')

          echo "TENANT_SLUG=$TENANT_SLUG" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Set Release Tag
        run: |
          if [ -z "$TENANT_SLUG" ]; then TENANT_SLUG="merchant"; fi
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi

          RELEASE_TAG="${TENANT_SLUG}-v${VERSION}"
          RELEASE_TAG=$(echo "$RELEASE_TAG" | tr -d '\n' | tr -d ' ')

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Generated tag: $RELEASE_TAG"

      - name: Verify Android configuration
        run: |
          echo "========== build.gradle.kts =========="
          grep applicationId android/app/build.gradle.kts || true

          echo "========== AndroidManifest =========="
          grep "android:label" android/app/src/main/AndroidManifest.xml || true

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/erteqa-merchant-key.jks

      # 🚀 FIXED BUILD (IMPORTANT FOR INSTALL ISSUE)
      - name: Build APK (UNIVERSAL FIXED)
        env:
          ANDROID_KEYSTORE_PATH: "erteqa-merchant-key.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter clean
          flutter pub get

          flutter build apk --release \
            --no-tree-shake-icons \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Merchant APK Build - ${{ env.APP_NAME }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Download URL
        run: |
          APK_NAME="app-release.apk"

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"

          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"
          echo "Generated URL: $DOWNLOAD_URL"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TENANT_SLUG }}-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Send Download Link to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ تم بناء تطبيق أندرويد بنجاح

            📱 اسم التطبيق:
            ${{ env.APP_NAME }}

            🏷️ Tenant Slug:
            ${{ env.TENANT_SLUG }}

            📦 Version:
            ${{ env.VERSION }}

            🔗 رابط التحميل المباشر:
            ${{ env.DOWNLOAD_URL }}