name: Build merchant Android APK

on:
  repository_dispatch:
    types: [build-merchant-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate dispatch payload and create merchant manifest
        env:
          # دعم الطريقتين: إما أن تأتي البيانات داخل app_data أو مباشرة في client_payload
          DISPATCH_PAYLOAD: ${{ github.event.client_payload.app_data || toJson(github.event.client_payload) }}
        run: |
          echo "$DISPATCH_PAYLOAD" | jq '.' > dispatch-payload.json
          
          dart run tool/prepare_merchant_manifest_from_dispatch.dart \
            dispatch-payload.json merchant-build.json

      - name: Apply merchant build
        run: |
          dart run tool/apply_merchant_build.dart merchant-build.json
          
          echo "TENANT_SLUG=$(jq -r '.tenant_slug // "merchant"' merchant-build.json)" >> "$GITHUB_ENV"
          echo "APP_NAME=$(jq -r '.app_name // "App"' merchant-build.json)" >> "$GITHUB_ENV"

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # فك تشفير ملف التوقيع وحفظه في مجلد أندرويد
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/erteqa-merchant-key.jks

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: "erteqa-merchant-key.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(jq -r '.version // "1.0.0"' merchant-build.json)
          BUILD_NUMBER=$(jq -r '.build_number // "1"' merchant-build.json)
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TENANT_SLUG }}-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GoFile
        id: upload_gofile
        run: |
          RESPONSE=$(curl -sS -F "file=@build/app/outputs/flutter-apk/app-release.apk" https://store1.gofile.io/contents/uploadfile)
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "GoFile upload failed: $RESPONSE"
            exit 1
          fi
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"

      - name: Send Download Link to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            تم بناء تطبيق أندرويد جديد بنجاح.

            اسم التطبيق: ${{ env.APP_NAME }}
            المعرّف (Slug): ${{ env.TENANT_SLUG }}
            الإصدار: ${{ github.event.client_payload.version || '1.0.0' }}

            رابط التحميل:
            ${{ env.DOWNLOAD_URL }}